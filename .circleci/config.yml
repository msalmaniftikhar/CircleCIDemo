version: 2.1

executors:
  php-executor:
    docker:
      - image: cimg/php:8.2

jobs:
  build:
    executor: php-executor
    steps:
      - checkout

      - run:
          name: Install Composer dependencies
          command: composer install --no-interaction --prefer-dist

      - run:
          name: Validate PHP syntax
          command: find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - run:
          name: Run application
          command: php index.php

      - run:
          name: Run tests with coverage
          command: |
            mkdir -p build/coverage
            XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover build/coverage/clover.xml

      - run:
          name: Human gate check
          command: bash scripts/human-gate.sh

      - run:
          name: Run SonarCloud analysis
          command: |
            curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
            unzip -q sonar-scanner.zip
            ./sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
              -Dsonar.organization=msalmaniftikhar \
              -Dsonar.projectKey=circlecidemo \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=${SONAR_TOKEN}

workflows:
  main:
    jobs:
      - build
